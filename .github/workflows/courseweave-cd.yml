name: CourseWeave CD

on:
  workflow_run:
    workflows: ["CourseWeave CI"]
    types:
      - completed

env:
  GCP_REGION: us-central1
  BACKEND_SERVICE: courseweave-backend
  FRONTEND_SERVICE: courseweave-frontend
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push backend image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/courseweave/backend:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "BACKEND_IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} --image ${{ env.BACKEND_IMAGE }} --region ${{ env.GCP_REGION }} --platform managed --allow-unauthenticated --memory 1Gi --cpu 1 --min-instances 0 --max-instances 3 --set-secrets="PINECONE_API_KEY=PINECONE_API_KEY:latest,DB_PASSWORD=DB_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest,ADZUNA_APP_KEY=ADZUNA_APP_KEY:latest,GROQ_API_KEY=GROQ_API_KEY:latest" --set-env-vars="GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},GCP_LOCATION=us-central1,DB_HOST=34.23.27.68,DB_PORT=5432,DB_NAME=courseweave,DB_USER=courseweave_user,PINECONE_INDEX_NAME=courseweave-hybrid,ADZUNA_APP_ID=0bfaed10,GCS_BUCKET=courseweave-ai-data,GOOGLE_APPLICATION_CREDENTIALS=/app/configs/course-urls.json"

      - name: Print backend URL
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          echo "Backend deployed at: $BACKEND_URL"

  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Get backend URL
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          echo "VITE_API_URL=$BACKEND_URL" >> $GITHUB_ENV

      - name: Build and push frontend image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/courseweave/frontend:${{ github.sha }}
          cd frontend
          echo "VITE_API_URL=${{ env.VITE_API_URL }}" > .env.production
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "FRONTEND_IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image ${{ env.FRONTEND_IMAGE }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2

      - name: Print frontend URL
        run: |
          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          echo "Frontend deployed at: $FRONTEND_URL"

      - name: Update backend CORS with frontend URL
        run: |
          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          gcloud run services update ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --update-env-vars="FRONTEND_URL=$FRONTEND_URL"
