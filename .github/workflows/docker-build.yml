name: Docker Build

on:
  workflow_run:
    workflows: ["CourseWeave CI"]
    types:
      - completed

jobs:
  docker:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t courseweave .

    - name: Test container
      run: |
        docker run --rm courseweave python -c "print('Docker OK')"