name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check src/

      - name: Mypy type check
        run: uv run mypy src/ --ignore-missing-imports

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint

    # Provide dummy env vars so modules that read .env at import time don't crash
    env:
      GCP_PROJECT_ID: test-project
      GCP_LOCATION: us-central1
      PINECONE_API_KEY: dummy
      PINECONE_INDEX_NAME: dummy
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: courseweave
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv sync --frozen

      - name: Run unit tests
        # tests/unit/ should mock Pinecone, Postgres, and Gemini
        run: uv run pytest tests/unit/ -v --tb=short

  eval:
    name: Eval runner (offline metrics)
    runs-on: ubuntu-latest
    needs: unit-tests

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_LOCATION: us-central1
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: 5432
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install deps
        run: uv sync --frozen

      - name: Write GCP service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-key.json

      - name: Run eval runner
        run: uv run python src/evaluation/eval_runner.py

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: data/eval_results.json

      - name: Check pass rate threshold
        # Fail CI if pass rate drops below 0.8
        run: |
          python - <<'EOF'
          import json, sys
          with open("data/eval_results.json") as f:
              r = json.load(f)
          rate = r.get("pass_rate", 0)
          print(f"Pass rate: {rate}")
          if rate < 0.8:
              print("FAIL: pass rate below 0.8 threshold")
              sys.exit(1)
          EOF