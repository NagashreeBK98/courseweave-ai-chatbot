name: CD

on:
  push:
    branches: [main]          # deploy to staging on every merge
  release:
    types: [published]        # deploy to production on tagged release

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/courseweave/api

jobs:
  build-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          TAG=${{ github.sha }}
          docker build -t ${{ env.IMAGE }}:$TAG -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:$TAG
          docker push ${{ env.IMAGE }}:latest

  deploy-staging:
    name: Deploy to Cloud Run (staging)
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run (staging)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: courseweave-api-staging
          image: ${{ env.IMAGE }}:${{ github.sha }}
          region: ${{ env.REGION }}
          env_vars: |
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GCP_LOCATION=us-central1
            PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
          secrets: |
            PINECONE_API_KEY=pinecone-api-key:latest
            DB_PASSWORD=db-password:latest

  deploy-production:
    name: Deploy to Cloud Run (production)
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'release'

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run (production)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: courseweave-api-prod
          image: ${{ env.IMAGE }}:${{ github.sha }}
          region: ${{ env.REGION }}
          env_vars: |
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GCP_LOCATION=us-central1
            PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
          secrets: |
            PINECONE_API_KEY=pinecone-api-key:latest
            DB_PASSWORD=db-password:latest